name: CI check (fork only)

on:
  push:
    branches:
      - ci-check-elide-rtl

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: false
  RUSTFLAGS: -D warnings

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-linux-dependencies
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all -- --check
      # Same as scripts/run_clippy.sh (library code, no --all-targets), for this one crate.
      - name: clippy i-slint-core
        run: cargo clippy --locked -p i-slint-core -- -D warnings
      # RUSTFLAGS=-D warnings also makes any rustc warning in the test code fail here.
      - name: test i-slint-core
        run: cargo test --locked -p i-slint-core
      - name: run the new elide tests by name
        run: cargo test --locked -p i-slint-core --lib test_elide -- --nocapture
      # Report only: clippy notes on the test code of the 3 changed files.
      - name: clippy notes in the changed files (report only)
        continue-on-error: true
        env:
          RUSTFLAGS: ""
        run: |
          cargo clippy --locked -p i-slint-core --all-targets --message-format=short 2>&1 \
            | grep -E 'sharedparley/(draw|layout|tests)\.rs' \
            || echo "no clippy notes in the changed files"

  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cspell on the changed files
        run: npx --yes cspell@10.4.0 --no-progress internal/core/textlayout/sharedparley/draw.rs internal/core/textlayout/sharedparley/layout.rs internal/core/textlayout/sharedparley/tests.rs
