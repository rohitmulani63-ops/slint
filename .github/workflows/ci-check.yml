name: CI check (fork only)

on:
  push:
    branches:
      - ci-check-elide-rtl

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: false
  RUSTFLAGS: -D warnings

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-linux-dependencies
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all -- --check
      # Default features (they include shared-parley). Building i-slint-core alone with
      # --all-features breaks zeno (needs std or libm, which the full workspace provides).
      - name: clippy i-slint-core lib (strict)
        run: cargo clippy --locked -p i-slint-core --lib -- -D warnings
      # i-slint-backend-testing (a dev-dependency) trips clippy::needless_update when built
      # alone, because a TestingBackendOptions field only exists with cfg(supports_headless).
      # Upstream lints the whole workspace, so it never shows there. Allow only that lint.
      - name: clippy i-slint-core all targets
        run: cargo clippy --locked -p i-slint-core --all-targets -- -D warnings -A clippy::needless_update
      - name: test i-slint-core
        run: cargo test --locked -p i-slint-core
      - name: test our new elide tests (listed)
        run: cargo test --locked -p i-slint-core --lib elid -- --nocapture --list

  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cspell on the changed files
        run: npx --yes cspell@10.4.0 --no-progress internal/core/textlayout/sharedparley/draw.rs internal/core/textlayout/sharedparley/layout.rs internal/core/textlayout/sharedparley/tests.rs
